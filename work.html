<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <script>
        (function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();

    <style>
        :root {
            --white: #fff;
            --black: #0a0a0a;
            --blue: #00f;
            --orange: #f60;
            --grey-50: #f5f5f5;
            --grey-100: #f5f5f5;
            --grey-200: #e5e5e5;
            --grey-300: #d4d4d4;
            --grey-400: #a3a3a3;
            --grey-500: #737373;
            --grey-600: #525252;
            --grey-700: #404040;
            --grey-800: #262626;
            --grey-900: #171717;
            --accent: var(--blue);
            --inverse-accent: var(--orange);
            --background: var(--white);
            --foreground: var(--black);
            --muted: var(--grey-500);
            --border: var(--grey-200);
            --link: var(--grey-500);
            --link-hover: var(--accent);
            --surface: var(--grey-200);
            --surface-hover: var(--grey-100);
            --surface-elevated: var(--grey-300);
            --inverted-background: var(--black);
            --inverted-foreground: var(--white);
            --inverted-muted: var(--grey-400);
            --dot-pattern: var(--grey-300);
            --overlay-bg: #0009;
            --tiniest: 4px;
            --tinier: 8px;
            --tiny: 12px;
            --smallest: 16px;
            --smaller: 24px;
            --small: 32px;
            --big: 48px;
            --bigger: 64px;
            --biggest: 96px;
            --huge: 128px;
            --gap: var(--smallest);
            --margin: var(--smallest);
            --columns: 6;
            --radius: 6px;
            --radius-full: 9999px;
            --radius-large: 8px;
            --radius-medium: 6px;
            --radius-small: 4px;
            overscroll-behavior-y: none;
            font-family: Inter, sans-serif;
        }
        @media (min-width: 769px) {
            :root {
                --margin: var(--small);
                --columns: 12;
            }
        }
        [data-theme="dark"] {
            --accent: var(--orange);
            --inverse-accent: var(--blue);
            --background: var(--black);
            --foreground: var(--white);
            --muted: var(--grey-400);
            --border: var(--grey-800);
            --link: var(--grey-400);
            --surface: var(--grey-900);
            --surface-hover: var(--grey-800);
            --surface-elevated: var(--grey-700);
            --inverted-background: var(--white);
            --inverted-foreground: var(--black);
            --inverted-muted: var(--grey-600);
            --dot-pattern: var(--grey-700);
            --overlay-bg: #000c;
        }

        /* Selection */
        ::selection { background-color: var(--accent); color: var(--white); }

        *, a, button { cursor: none !important; }
        .cursor-dot { position: fixed; pointer-events: none; z-index: 2147483647; transform: translate(-50%, -50%); transition: font-size 0.2s ease, transform 0.3s ease; font-size: 18px; font-weight: 300; color: #fff; mix-blend-mode: difference; line-height: 1; }
        .cursor-ring { position: fixed; width: 28px; height: 28px; border: 2px solid #fff; mix-blend-mode: difference; border-radius: 50%; pointer-events: none; z-index: 2147483646; transform: translate(-50%, -50%); transition: width 0.2s ease, height 0.2s ease, opacity 0.2s ease; opacity: 0.3; }
        .cursor-ring.hovering { width: 56px; height: 56px; opacity: 0.8; }
        @keyframes cursorSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        .cursor-dot.hovering { font-size: 26px; font-weight: 300; animation: cursorSpin 2s linear infinite; }
        @media (max-width: 768px) { .cursor-dot, .cursor-ring { display: none; } *, a, button { cursor: auto !important; } }

        /* Base reset */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { width: 100%; max-width: 100%; background: var(--foreground); }
        body { background: none; color: var(--foreground); font-feature-settings: "liga" 1, "calt" 1, "ss04" 1, "ss07" 1; font-optical-sizing: auto; text-wrap: pretty; width: 100%; max-width: 100%; min-height: 100vh; margin: 0; padding: 0; font-family: Inter, sans-serif; font-weight: 400; line-height: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        a { color: inherit; text-decoration: inherit; }
        img, video { max-width: 100%; height: auto; }
        button, input, select, textarea { font: inherit; color: inherit; background: transparent; }
        h1 { font-size: var(--bigger); letter-spacing: -0.025em; margin: 0; font-weight: 500; line-height: 100%; }
        h2 { font-size: var(--small); letter-spacing: -0.025em; margin: 0; font-weight: 500; line-height: 100%; }
        h3 { font-size: var(--smaller); letter-spacing: -0.01em; margin: 0; font-weight: 500; line-height: 110%; }
        h4 { letter-spacing: -0.01em; margin: 0; font-size: 18px; font-weight: 500; line-height: 110%; }
        p { font-size: var(--smallest); letter-spacing: -0.01em; margin: 0; line-height: 140%; }
        @media (max-width: 768px) { h1 { font-size: var(--big); } h2 { font-size: var(--smaller); } h3 { font-size: 20px; } }

        /* Header */
        header { padding: var(--margin); pointer-events: none; position: relative; }
        .header-inner { pointer-events: auto; justify-content: space-between; align-items: center; display: flex; }
        .logo { font-size: var(--smallest); color: var(--foreground); letter-spacing: -0.01em; font-weight: 500; text-decoration: none; }
        nav { align-items: center; gap: var(--smaller); display: flex; }
        .nav-sep { color: var(--border); font-weight: 300; font-size: 14px; }
        .nav-link { font-size: var(--smallest); color: var(--muted); font-weight: 400; text-decoration: none; transition: color 0.2s; }
        .nav-link:hover { color: var(--foreground); }
        .nav-link.active { color: var(--foreground); }
        .theme-toggle { width: 32px; height: 32px; margin-left: var(--tinier); color: var(--muted); cursor: pointer; background: none; border: none; justify-content: center; align-items: center; padding: 0; transition: color 0.2s; display: flex; }
        .theme-toggle:hover { color: var(--foreground); }
        .icon-sun { display: block; }
        .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: block; }

        /* Back button */
        .back-button { width: 32px; height: 32px; margin-right: var(--tinier); color: var(--muted); display: flex; justify-content: center; align-items: center; transition: color 0.2s; }
        .back-button:hover { color: var(--foreground); }

        @media (max-width: 768px) {
            header { z-index: 1000; background-color: var(--background); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
            nav { gap: var(--smallest); }
            .theme-toggle { width: 24px; height: 24px; }
        }

        /* Main */
        main { min-height: 100vh; padding: var(--big) var(--margin) var(--margin); gap: var(--bigger); flex-direction: column; display: flex; max-width: 1336px; margin: 0 auto; position: relative; }
        .page-content::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(0,0,0,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.09) 1px, transparent 1px), linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px); background-size: 200px 200px, 200px 200px, 40px 40px, 40px 40px, 10px 10px, 10px 10px; }
        [data-theme="dark"] .page-content::after { background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); }
        @media (max-width: 768px) { main { padding: var(--small) var(--margin) var(--margin); } }

        /* Page header */
        .page-header { gap: var(--smallest); margin-bottom: var(--small); flex-direction: column; display: flex; }
        .page-header h1 { font-weight: 500; }
        .page-description { font-size: var(--smallest); color: var(--muted); max-width: 500px; }

        /* Badge */
        .badge { position: absolute; top: var(--tinier); left: var(--tinier); background: var(--foreground); color: var(--background); font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: var(--radius-small); z-index: 2; }

        /* Masonry grid */
        .masonry { column-count: 3; column-gap: var(--tinier); }
        @media (max-width: 900px) { .masonry { column-count: 2; } }
        @media (max-width: 500px) { .masonry { column-count: 1; } }

        /* Filter links */
        .filter-link { color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em; cursor: pointer; background: none; border: none; font: inherit; font-size: inherit; padding: 0; transition: color 0.2s; }
        .filter-link:hover { color: var(--accent); }
        .filter-link.active { color: var(--accent); position: relative; }
        .filter-link.active::before { content: ''; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin-left: -20px; margin-top: -20px; background: rgba(0, 0, 255, 0.15); border-radius: 50%; z-index: -1; }
        [data-theme="dark"] .filter-link.active::before { background: rgba(255, 102, 0, 0.25); }

        /* Card entrance animation */
        @keyframes cardIn { from { opacity: 0; transform: translateY(75px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes imageIn { 0% { filter: blur(12px); transform: scale(0.9); } 50% { filter: blur(12px); transform: scale(1); } 100% { filter: blur(0px); transform: scale(1); } }

        /* Project card — double-div border trick */
        .project-card { break-inside: avoid; margin-bottom: var(--tinier); cursor: pointer; border-radius: 8px; position: relative; background: var(--border); padding: 1px; box-shadow: 0px 0px 20px rgba(0,0,0,0.06); opacity: 0; animation: cardIn 0.35s ease-out forwards; }
        [data-theme="dark"] .project-card { background: var(--grey-800); box-shadow: 0px 0px 20px rgba(0,0,0,0.15); }
        @media (min-width: 769px) { .project-card { border-radius: 16px; } }
        .project-card-body { background: var(--background); border-radius: 7px; padding: 6px; overflow: hidden; position: relative; clip-path: inset(0 round 7px); }
        [data-theme="dark"] .project-card-body { background: var(--grey-900); }
        @media (min-width: 769px) { .project-card-body { border-radius: 15px; } }
        .project-card-inner { overflow: hidden; border-radius: 4px; position: relative; transition: transform 0.3s ease; }
        @media (min-width: 769px) { .project-card-inner { border-radius: 12px; } }
        
        .project-card img, .project-card video { width: 100%; height: auto; display: block; transition: transform 0.3s ease; object-fit: cover; animation: imageIn 0.5s ease-out forwards; }
        
        .project-card-title { position: absolute; bottom: 0; left: 0; width: 100%; padding: var(--tiny) var(--smaller); font-size: 17px; font-weight: 500; color: var(--foreground); background: var(--background); transform: translateY(100%); transition: transform 0.3s ease; }
        .project-card-title::before, .project-card-title::after { content: ''; position: absolute; top: -12px; width: 12px; height: 12px; }
        .project-card-title::before { left: 4px; background: radial-gradient(circle at 100% 0, transparent 12px, var(--background) 12px); }
        .project-card-title::after { right: 4px; background: radial-gradient(circle at 0 0, transparent 12px, var(--background) 12px); }
        [data-theme="dark"] .project-card-title { background: var(--grey-900); }
        [data-theme="dark"] .project-card-title::before { background: radial-gradient(circle at 100% 0, transparent 12px, var(--grey-900) 12px); }
        [data-theme="dark"] .project-card-title::after { background: radial-gradient(circle at 0 0, transparent 12px, var(--grey-900) 12px); }
        .project-card:hover .project-card-title { transform: translateY(0); }
        .cursor-tooltip { position: fixed; z-index: 2147483645; pointer-events: none; background: var(--foreground); color: var(--background); font-family: Inter, sans-serif; font-size: var(--smallest); padding: 4px 4px; border-radius: 20px; line-height: 1.4; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; transition: width 0.45s ease-in-out, opacity 0.2s ease, padding 0.35s ease-in-out, border-radius 0.35s ease-in-out; }
        .cursor-tooltip.visible { opacity: 1; }
        .cursor-tooltip.typing { padding: 8px 14px; border-radius: 12px; }
        .cursor-tooltip::after { content: ''; position: absolute; bottom: -4px; right: 12px; width: 8px; height: 8px; background: var(--foreground); transform: rotate(45deg); }
        .hover-hint { display: inline-block; background: var(--foreground); color: var(--background); font-family: Inter, sans-serif; font-size: var(--smallest); padding: 4px 12px; border-radius: 10px; position: relative; margin: 0 4px; vertical-align: middle; }

        /* Dialog/Modal */
        dialog { border: none; background: none; padding: 0; max-width: min(1050px, 92vw); width: 100%; max-height: 85vh; border-radius: var(--smaller); overflow: hidden; margin: auto; }
        dialog::backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        dialog[open] { display: flex; flex-direction: column; animation: dialogIn 0.3s ease; }
        @keyframes dialogIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes dialogImageIn { 0% { filter: blur(12px); transform: scale(0.9); } 50% { filter: blur(12px); transform: scale(1); } 100% { filter: blur(0px); transform: scale(1); } }
        .dialog-images img.first-load, .dialog-images video.first-load { animation: dialogImageIn 0.5s ease-out forwards; }
        .dialog-content { background: var(--background); border: 1px solid var(--border); border-radius: var(--smaller); overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; max-height: inherit; scrollbar-width: none; }
        .dialog-content::-webkit-scrollbar { display: none; }
        .dialog-images { position: relative; overflow: hidden; background: var(--surface); min-height: 400px; }
        .dialog-images img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
        .dialog-images video { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
        .dialog-close { position: absolute; top: var(--tinier); right: var(--tinier); width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--surface-hover); border: 1px solid var(--border); color: var(--foreground); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: background 0.15s; }
        .dialog-close:hover { background: var(--surface-hover); }
        .dialog-info { padding: var(--smaller); display: flex; flex-direction: column; gap: var(--tiny); overflow-y: auto; scrollbar-width: none; max-height: 85vh; }
        .dialog-info::-webkit-scrollbar { display: none; }
        @media (max-width: 768px) { .dialog-content { grid-template-columns: 1fr; } .dialog-images { min-height: 250px; } }
        .dialog-info::-webkit-scrollbar { display: none; }
        .carousel-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--background); border: 1px solid var(--border); color: var(--foreground); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: opacity 0.15s; opacity: 0.7; }
        .carousel-nav:hover { opacity: 1; }
        .carousel-prev { left: var(--tinier); }
        .carousel-next { right: var(--tinier); }
        .dialog-info h2 { font-size: var(--smaller); font-weight: 600; letter-spacing: -0.01em; color: var(--foreground); }
        .dialog-tags { display: flex; flex-wrap: wrap; gap: var(--tinier); }
        .dialog-tag { font-size: 13px; color: var(--muted); background: var(--surface); padding: 2px var(--tinier); border-radius: var(--radius); }
        .dialog-section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: var(--tiny); }
        .dialog-text { font-size: 14px; color: var(--foreground); line-height: 160%; }
        .dialog-text ul { padding-left: var(--smallest); margin: var(--tinier) 0 0; }
        .dialog-text li { margin-bottom: 4px; }
        .dialog-divider { border: none; border-top: 1px solid var(--border); margin: var(--tinier) 0; }
        .dialog-link { font-size: 14px; color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em; }
        .dialog-link:hover { color: var(--accent); }

        /* Image carousel dots */
        .carousel-dots { display: flex; gap: var(--tinier); justify-content: center; padding: var(--tinier); position: absolute; bottom: var(--tinier); left: 50%; transform: translateX(-50%); z-index: 2; }
        .carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: 0.3; border: none; cursor: pointer; padding: 0; transition: opacity 0.2s; }
        .carousel-dot.active { opacity: 1; }

        /* Footer */
        footer { width: 100%; padding: var(--bigger) var(--margin) var(--small); background-color: var(--foreground); color: var(--background); overflow: hidden; }
        @media (min-width: 769px) { footer { z-index: 0; position: fixed; bottom: 0; left: 0; right: 0; } }
        @media (max-width: 768px) { footer { position: relative; } }
        footer a { color: var(--background); transition: opacity 0.15s; text-decoration: none; }
        footer a:hover { opacity: 0.6; }
        .footer-content { display: flex; flex-direction: column; gap: var(--smaller); }
        .footer-row { display: flex; justify-content: space-between; align-items: center; gap: var(--big); }
        
        
        .footer-ascii { width: 300px; height: auto; opacity: 0.5; flex-shrink: 0; }
        [data-theme="dark"] .footer-ascii { content: url(robot-ascii-dark.png); }
        .footer-sep { opacity: 0.5; }
        
        .big-email { color: var(--background); text-underline-offset: 0.2em; letter-spacing: -0.02em; font-size: 24px; font-weight: 500; line-height: 100%; text-decoration: underline #ffffff59; transition: opacity 0.15s; width: fit-content; }
        .big-email:hover { opacity: 0.85; cursor: ne-resize; }
        @media (min-width: 769px) { .big-email { font-size: clamp(32px, 5.5vw, 72px); letter-spacing: -0.03em; } }
        .footer-bottom { display: flex; flex-wrap: wrap; gap: var(--tinier); font-size: 13px; opacity: 0.4; }
        .footer-bottom a { text-decoration: underline; text-underline-offset: 0.15em; }
        @media (max-width: 768px) { .footer-row { flex-direction: column; } .footer-ascii { display: none; } }

        /* Page content wrapper and footer spacer */
        .page-content { z-index: 1; background: var(--background); min-height: 100vh; position: relative; border-radius: 0 0 var(--smaller) var(--smaller); overflow: hidden; }
        .footer-spacer { display: none; }
        @media (min-width: 769px) { .footer-spacer { height: calc(var(--footer-height, 400px) - var(--smaller)); pointer-events: none; display: block; } }

        /* Animations */
        .animate-in { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .animate-in.visible { opacity: 1; transform: translateY(0); }

        /* Skeleton shimmer for lazy images */
        .skeleton {
            background: var(--surface);
            background-image: linear-gradient(90deg, var(--surface) 0%, var(--surface-elevated) 50%, var(--surface) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .img-loaded { animation: none; background: none; }
    </style>
</head>

<!-- Preload sounds -->
<script>
(function() {
    fetch('projects.json')
        .then(function(r) { return r.json(); })
        .then(function(projects) {
            // Normalize: build images array from media if needed
            projects.forEach(function(p) {
                if (p.media && !p.images) {
                    p.images = p.media.filter(function(m) { return m.type !== 'video'; }).map(function(m) { return m.src; });
                }
                if (!p.images) p.images = [];
                // Use description as fallback for outcome
                if (!p.outcome && p.description) p.outcome = p.description;
            });
            renderProjects(projects);
        });

    function renderProjects(projects) {
    var grid = document.getElementById('projectGrid');

    projects.forEach(function(project, i) {
        // Create card
        var card = document.createElement('div');
        card.className = 'project-card';

        card.setAttribute('data-filters', (project.filters || []).join(','));
        if (project.tooltips && project.tooltips.length) card.setAttribute('data-tooltips', JSON.stringify(project.tooltips));
        else if (project.tooltip) card.setAttribute('data-tooltips', JSON.stringify([project.tooltip]));
        card.innerHTML =
            '<div class="project-card-body">' +
                '<div class="project-card-inner">' +
                    ((/\.(mp4|webm|mov)$/i.test(project.preview)) ?
                    '<video src="' + project.preview + '" muted autoplay loop playsinline style="aspect-ratio:' + (project.aspect || 'auto') + ';"></video>' :
                    '<img src="' + project.preview + '" alt="' + project.title + '" style="aspect-ratio:' + (project.aspect || 'auto') + ';" onerror="this.style.opacity=\'0\'">') +
                '</div>' +
                '<div class="project-card-title">' + project.title + '</div>' +
            '</div>';

        // Create dialog
        var dialog = document.createElement('dialog');
        dialog.id = 'dialog-' + project.slug;

        var allMedia = project.media || project.images.map(function(s) { return { type: 'image', src: s }; });
        var mediaItems = allMedia.filter(function(m) { return m.src !== project.preview; });
        var mediaHTML = mediaItems.map(function(m, j) {
            if (m.type === 'video') {
                return '<video src="' + m.src + '"' + (m.poster ? ' poster="' + m.poster + '"' : '') + ' muted playsinline loop style="display:' + (j === 0 ? 'block' : 'none') + ';" data-index="' + j + '"></video>';
            }
            return '<img src="' + m.src + '" alt="' + project.title + '" style="display:' + (j === 0 ? 'block' : 'none') + ';" data-index="' + j + '" onerror="this.style.display=\'none\'">';
        }).join('');

        var dotsHTML = '';
        if (mediaItems.length > 1) {
            dotsHTML = '<div class="carousel-dots">' +
                mediaItems.map(function(_, j) {
                    return '<button class="carousel-dot' + (j === 0 ? ' active' : '') + '" data-index="' + j + '"></button>';
                }).join('') +
                '</div>';
        }

        var tagsHTML = project.tags.map(function(tag) {
            return '<span class="dialog-tag">' + tag + '</span>';
        }).join('');

        var arrowsHTML = '';
        if (mediaItems.length > 1) {
            arrowsHTML =
                '<button class="carousel-nav carousel-prev" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
                '<button class="carousel-nav carousel-next" aria-label="Next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>';
        }

        dialog.innerHTML =
            '<div class="dialog-content">' +
                '<div class="dialog-images">' +
                    '<button class="dialog-close" aria-label="Close">' +
                        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
                    '</button>' +
                    arrowsHTML +
                    mediaHTML +
                    dotsHTML +
                '</div>' +
                '<div class="dialog-info">' +
                    '<h2>' + project.title + '</h2>' +
                    '<div class="dialog-tags">' + tagsHTML + '</div>' +
                    '<hr class="dialog-divider">' +
                    (project.outcome ? '<p class="dialog-section-label">Outcome</p><p class="dialog-text">' + project.outcome + '</p>' : '') +
                    (project.role ? '<p class="dialog-section-label">My Role</p><p class="dialog-text">' + project.role + '</p>' : '') +
                    (project.skills ? '<p class="dialog-section-label">Skills</p><div class="dialog-tags">' + project.skills.map(function(s) { return '<span class="dialog-tag">' + s + '</span>'; }).join('') + '</div>' : '') +
                    (project.motivation ? '<p class="dialog-section-label">Motivation</p><p class="dialog-text">' + project.motivation + '</p>' : '') +
                    (project.technical ? '<p class="dialog-section-label">Technical Details</p><p class="dialog-text">' + project.technical + '</p>' : '') +
                    (project.link !== '#' ? '<hr class="dialog-divider"><a href="' + project.link + '" class="dialog-link">View full project &rarr;</a>' : '') +
                '</div>' +
            '</div>';

        document.body.appendChild(dialog);

        // Card click opens dialog
        card.addEventListener('click', function() {
            var firstMedia = dialog.querySelector('.dialog-images img[data-index="0"], .dialog-images video[data-index="0"]');
            if (firstMedia) firstMedia.classList.add('first-load');
            dialog.showModal();
            dialog.appendChild(dot);
            dialog.appendChild(ring);
            // Auto-play if first item is video
            if (firstMedia && firstMedia.tagName === 'VIDEO') {
                firstMedia.play().catch(function(){});
            }
            setTimeout(function() { if (firstMedia) firstMedia.classList.remove('first-load'); }, 600);
        });

        // Close button
        dialog.querySelector('.dialog-close').addEventListener('click', function(e) {
            e.stopPropagation();
            dialog.close();
        });

        // Move cursor back to body on close + pause videos
        dialog.addEventListener('close', function() {
            document.body.appendChild(dot);
            document.body.appendChild(ring);
            dialog.querySelectorAll('video').forEach(function(v) { v.pause(); });
        });

        // Close on backdrop click
        dialog.addEventListener('click', function(e) {
            if (e.target === dialog) {
                dialog.close();
            }
        });

        // Carousel logic
        var dots = dialog.querySelectorAll('.carousel-dot');
        var allMedia = dialog.querySelectorAll('.dialog-images img, .dialog-images video');
        var currentIdx = 0;
        function goTo(idx) {
            if (!allMedia.length) return;
            currentIdx = (idx + allMedia.length) % allMedia.length;
            allMedia.forEach(function(el, j) {
                el.style.display = j === currentIdx ? 'block' : 'none';
                if (el.tagName === 'VIDEO') { j === currentIdx ? el.play() : el.pause(); }
            });
            dots.forEach(function(d, j) { d.classList.toggle('active', j === currentIdx); });
        }
        dots.forEach(function(dot) { dot.addEventListener('click', function(e) { e.stopPropagation(); goTo(parseInt(dot.getAttribute('data-index'))); }); });
        var prevBtn = dialog.querySelector('.carousel-prev');
        var nextBtn = dialog.querySelector('.carousel-next');
        if (prevBtn) prevBtn.addEventListener('click', function(e) { e.stopPropagation(); goTo(currentIdx - 1); });
        if (nextBtn) nextBtn.addEventListener('click', function(e) { e.stopPropagation(); goTo(currentIdx + 1); });

        card.style.animationDelay = (i * 0.05) + 's';
        var cardImg = card.querySelector('img');
        if (cardImg) cardImg.style.animationDelay = (i * 0.05) + 's';
        grid.appendChild(card);
    });

    // Measure title heights and set CSS variable
    function measureTitles() {
        document.querySelectorAll('.project-card').forEach(function(card) {
            var title = card.querySelector('.project-card-title');
            if (title) {
                var h = title.offsetHeight;
                card.style.setProperty('--title-h', h);
            }
        });
    }
    // Run after images load or immediately
    window.addEventListener('load', measureTitles);
    window.addEventListener('resize', measureTitles);
    measureTitles();

    // Filter links
    document.querySelectorAll('.filter-link').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-link').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            var filter = btn.getAttribute('data-filter');
            document.querySelectorAll('.project-card').forEach(function(card) {
                var f = card.getAttribute('data-filters');
                card.style.display = (filter === 'all' || f.indexOf(filter) !== -1) ? '' : 'none';
            });
        });
    });
    } // end renderProjects

    // Sound effects — use real audio files for clicks, Web Audio for typewriter
    var sounds = {
        click: new Audio('sounds/clickstart.mp3'),
        clickstart: new Audio('sounds/clickstart.mp3'),
        clickend: new Audio('sounds/clickend.mp3')
    };
    Object.values(sounds).forEach(function(s) { s.preload = 'auto'; s.volume = 0.8; });

    function playSound(name) {
        var s = sounds[name];
        if (!s) return;
        var clone = s.cloneNode();
        clone.volume = s.volume;
        clone.play().catch(function(){});
    }

    // Custom cursor
    var dot = document.getElementById('cursorDot');
    var ring = document.getElementById('cursorRing');
    var mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', function(e) {
        mx = e.clientX; my = e.clientY;
        dot.style.left = mx + 'px'; dot.style.top = my + 'px';
    });
    (function followRing() {
        var tx = mx, ty = my;
        if (currentTarget && !currentTarget.closest('.big-email') && currentTarget.closest('footer, .footer-links, header, nav, .filter-link')) {
            var rect = currentTarget.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            tx = mx + (cx - mx) * 0.4;
            ty = my + (cy - my) * 0.4;
        }
        rx += (tx - rx) * 0.15; ry += (ty - ry) * 0.15;
        ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
        requestAnimationFrame(followRing);
    })();
    var currentTarget = null;
    var tooltip = document.getElementById('cursorTooltip');
    var tooltipTimer = null;
    var typewriterInterval = null;
    var typewriterTimeout = null;
    var tooltipTx = 0, tooltipTy = 0;
    var hoveredCard = null;
    var tooltipGen = 0;

    // Typewriter sound — generate short blip via Web Audio API
    var audioCtx = null;
    // Only play sound every few characters, not every one
    var blipCount = 0;
    function playBlip() {
        blipCount++;
        if (blipCount % 2 !== 0) return; // sound every 2nd char
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 350 + Math.random() * 200;
        osc.type = 'square';
        gain.gain.value = 0.025;
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.08);
    }

    // Hidden measurer to calculate text width
    var measurer = document.createElement('div');
    measurer.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:Inter,sans-serif;font-size:var(--smallest);padding:8px 12px;';
    document.body.appendChild(measurer);

    var sequenceTimeout = null;
    function startTooltipSequence(texts, gen, reuseBox) {
        clearTimeout(sequenceTimeout);
        var idx = 0;
        function showNext() {
            if (gen !== tooltipGen) return;
            startTypewriter(texts[idx], idx > 0 || reuseBox, true);
            var myGen = tooltipGen; // capture gen AFTER startTypewriter sets it
            idx++;
            if (idx < texts.length) {
                var textDuration = texts[idx - 1].length * 35 + 500;
                var pauseDuration = 700;
                sequenceTimeout = setTimeout(function() {
                    if (myGen !== tooltipGen) return;
                    showNext();
                }, textDuration + pauseDuration);
            }
        }
        showNext();
    }

    function startTypewriter(text, reuseBox, fromSequence) {
        clearInterval(typewriterInterval);
        clearTimeout(hideTimeout);
        clearTimeout(typewriterTimeout);
        var gen = fromSequence ? tooltipGen : ++tooltipGen;
        var alreadyOpen = reuseBox || false;
        tooltip.textContent = '\u00A0';

        if (!alreadyOpen) {
            tooltip.style.width = '0px';
            tooltip.classList.remove('typing');
            tooltip.classList.remove('visible');
        }

        requestAnimationFrame(function() {
            if (gen !== tooltipGen) return;
            tooltip.classList.add('visible');
            requestAnimationFrame(function() {
                if (gen !== tooltipGen) return;
                tooltip.classList.add('typing');
                measurer.textContent = text;
                tooltip.style.width = measurer.offsetWidth + 'px';
            });
        });

        var delay = alreadyOpen ? 200 : 500;
        var i = 0;
        var typed = '';
        typewriterTimeout = setTimeout(function() {
            if (gen !== tooltipGen) return;
            typewriterInterval = setInterval(function() {
                if (gen !== tooltipGen) { clearInterval(typewriterInterval); return; }
                if (i < text.length) {
                    typed += text[i];
                    tooltip.textContent = typed;
                    if (text[i] !== ' ') playBlip();
                    i++;
                } else {
                    clearInterval(typewriterInterval);
                }
            }, 35);
        }, delay);
    }

    var hideTimeout = null;
    function hideTooltip(instant) {
        clearTimeout(tooltipTimer);
        clearTimeout(hideTimeout);
        clearTimeout(typewriterTimeout);
        clearTimeout(sequenceTimeout);
        clearInterval(typewriterInterval);
        if (!instant) tooltipGen++;
        if (instant) {
            // Keep box visible at current size — just clear text
            tooltip.textContent = '\u00A0';
        } else {
            // Full hide with shrink
            tooltip.style.width = '0px';
            tooltip.classList.remove('typing');
            hideTimeout = setTimeout(function() {
                tooltip.classList.remove('visible');
                tooltip.textContent = '';
            }, 350);
        }
        hoveredCard = null;
        blipCount = 0;
    }

    document.addEventListener('mouseover', function(e) {
        var t = e.target.closest('a, button, [onclick], .project-card-link, .featured-card, .project-card');
        if (t === currentTarget) return;
        currentTarget = t;
        if (t) { ring.classList.add('hovering'); dot.classList.add('hovering'); }
        else { ring.classList.remove('hovering'); dot.classList.remove('hovering'); }

        // Tooltip
        var card = e.target.closest('.project-card[data-tooltips]');
        if (card && card !== hoveredCard) {
            hideTooltip(false);
            hoveredCard = card;
            var texts = JSON.parse(card.getAttribute('data-tooltips'));
            var delay = 250 + Math.random() * 500;
            var gen = tooltipGen;
            tooltipTimer = setTimeout(function() {
                if (gen !== tooltipGen) return;
                var stillVisible = tooltip.classList.contains('visible');
                startTooltipSequence(texts, gen, stillVisible);
            }, delay);
        } else if (!card) {
            hideTooltip(false);
        }
    });

    // Tooltip follows cursor with lag, positioned above cursor centered
    (function followTooltip() {
        tooltipTx += (mx - tooltipTx) * 0.1;
        tooltipTy += (my - tooltipTy) * 0.1;
        tooltipTx += (mx - tooltipTx) * 0.08;
        tooltipTy += (my - tooltipTy) * 0.08;
        tooltip.style.right = (window.innerWidth - tooltipTx + 15) + 'px';
        tooltip.style.left = 'auto';
        tooltip.style.top = (tooltipTy - 50) + 'px';
        requestAnimationFrame(followTooltip);
    })();

    // Global click sound on links and buttons
    document.addEventListener('click', function(e) {
        if (e.target.closest('a, button, .filter-link, .project-card, .featured-card, .nav-link')) {
            playSound('click');
        }
    });

    // Theme toggle
    var toggle = document.querySelector('.theme-toggle');
    toggle.addEventListener('click', function() {
        playSound('click');
        var isDark = document.documentElement.hasAttribute('data-theme');
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.removeItem('theme');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    });

    // Intersection Observer for scroll animations
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.animate-in').forEach(function(el) { observer.observe(el); });

    // Footer height measurement
    function setFooterHeight() {
        var f = document.querySelector('footer');
        if (f) document.documentElement.style.setProperty('--footer-height', f.offsetHeight + 'px');
    }
    setFooterHeight();
    window.addEventListener('resize', setFooterHeight);
})();
</script>

</body>
