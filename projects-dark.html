<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>projects - matthew h zhang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap" rel="stylesheet">
    <style>
        @media (min-width: 901px) {
            html {
                zoom: 1;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #121212;
        }

        body {
            background: transparent;
            color: #e0e0e0;
            font-family: Consolas, Menlo, Monaco, 'Courier New', monospace;
            padding: 40px 20px;
            position: relative;
        }

        #rippleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin: 0 auto;
            transform-origin: center center;
            transition: transform 0.3s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        .header h1 {
            display: none;
        }

        .split-flap-container {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            justify-content: center;
            padding: 20px;
            padding-bottom: 0;
            width: max-content;
            transform-origin: center center;
            transition: transform 0.3s ease-out;
        }

        .flap-container {
            width: 50px;
            height: 70px;
            position: relative;
            perspective: 500px;
        }

        .flap {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        .flap-half {
            width: 100%;
            height: 50%;
            position: absolute;
            left: 0;
            overflow: hidden;
            background: #2a2a2a;
            border: 2px solid #1a1a1a;
        }

        .flap-top {
            top: 0;
            border-radius: 4px 4px 0 0;
        }

        .flap-bottom {
            bottom: 0;
            border-radius: 0 0 4px 4px;
        }

        .flap-content {
            width: 100%;
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: #e0e0e0;
            position: absolute;
            left: 0;
            line-height: 1;
            padding-bottom: 4px;
        }

        .flap-top .flap-content {
            top: 0;
            transform: translateY(0);
        }

        .flap-bottom .flap-content {
            bottom: 0;
            transform: translateY(0);
        }

        .flap-flip {
            width: 100%;
            height: 50%;
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: bottom;
            transform-style: preserve-3d;
            animation: flip 0.6s ease-in-out;
            z-index: 2;
        }

        @keyframes flip {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(-180deg);
            }
        }

        .flap-flip .flap-content {
            width: 100%;
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: #e0e0e0;
            position: absolute;
            left: 0;
            top: 0;
            background: #2a2a2a;
            border: 2px solid #1a1a1a;
            border-radius: 4px 4px 0 0;
            backface-visibility: hidden;
            line-height: 1;
            padding-bottom: 4px;
        }

        .space {
            width: 20px;
        }

        .filters {
            display: inline-flex;
            justify-content: center;
            gap: 22px;
            margin: -4px 0 36px;
            width: max-content;
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 26px;
            border-radius: 8px;
        }

        .filters-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .backlinks {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 0;
            font-size: 14px;
            font-family: Consolas, Menlo, Monaco, 'Courier New', monospace;
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .backlinks .prompt {
            margin-right: 6px;
        }

        .backlinks a {
            text-decoration: none;
            color: #E0A800;
            border-bottom: 1px solid #555;
            padding-bottom: 1px;
        }

        .backlinks a:hover {
            border-bottom-color: #E0A800;
        }

        .backlinks .prompt {
            color: #E0A800;
        }

        .backlinks .sep {
            color: #555;
        }


        .filter-btn {
            font-family: Consolas, Menlo, Monaco, 'Courier New', monospace;
            font-size: 18px;
            font-weight: 900;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            line-height: 1;
            padding: 4px 10px;
            position: relative;
            text-transform: uppercase;
            text-shadow: none;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: transparent;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .filter-btn:hover {
            color: #E0A800;
            text-shadow: none;
        }

        .filter-btn:hover::before {
            opacity: 0;
        }

        .filter-btn.active {
            color: #e0e0e0;
            text-shadow: none;
        }

        .filter-btn.active::before {
            opacity: 0;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 270px);
            gap: 60px 40px;
            margin-bottom: 60px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .project {
            text-align: center;
            padding: 20px;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            transition: box-shadow 0.3s ease, border-color 0.3s ease, scale 0.3s cubic-bezier(0.2, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            background: #1e1e1e;
            color: #e0e0e0;
            transform-style: preserve-3d;
            will-change: transform;
            overflow: hidden;
        }

        .project::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            background: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
            z-index: 10;
        }

        .project::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 12px;
            background: conic-gradient(from var(--border-angle, 0deg) at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.4), rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.0) 50%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 1.5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .project:not(.sorting):hover {
            border-color: transparent;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 8px 20px rgba(0,0,0,0.4);
            scale: 1.1;
        }

        .project:not(.sorting):hover::before {
            opacity: 1;
        }

        .project:not(.sorting):hover::after {
            opacity: 1;
        }

        .project a {
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            z-index: 1;
        }

        .project-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 0;
            min-height: 50px;
        }

        .project-image {
            width: 100%;
            height: 200px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            overflow: hidden;
        }

        .project-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .project-progress {
            font-weight: bold;
            margin-bottom: 0;
        }

        .project-description {
            font-size: 14px;
            line-height: 1.4;
            color: #aaa;
            margin-bottom: 0;
        }

        .project-date {
            font-size: 14px;
            color: #888;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            font-size: 16px;
            color: #0066cc;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }


        @media (max-width: 1199px) {
            .projects-grid {
                grid-template-columns: repeat(auto-fill, 270px);
            }
        }

        @media (max-width: 899px) {
            .projects-grid {
                grid-template-columns: repeat(auto-fill, 270px);
            }
        }

        @media (max-width: 599px) {
            .header h1 {
                font-size: 48px;
            }

            .title-block {
                transform: scale(0.65);
            }

            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 24px 16px;
                justify-items: start;
                margin-left: 0;
                margin-right: auto;
            }

            .project {
                max-width: 200px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

        <div class="container" style="position: relative;">

    <script>
        // Split-flap animation
        const startText = "hardware";
        const targetText = "projects";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ:&abcdefghijklmnopqrstuvwxyz";
        const splitFlapTitle = document.getElementById('splitFlapTitle');

        function createFlap(startChar, finalChar, index) {
            const container = document.createElement('div');
            
            if (finalChar === ' ') {
                container.className = 'space';
                return container;
            }
            
            container.className = 'flap-container';
            container.dataset.targetChar = finalChar;
            container.dataset.currentChar = startChar;
            
            const flap = document.createElement('div');
            flap.className = 'flap';
            
            const topHalf = document.createElement('div');
            topHalf.className = 'flap-half flap-top';
            const topContent = document.createElement('div');
            topContent.className = 'flap-content';
            topContent.textContent = startChar;
            topHalf.appendChild(topContent);
            
            const bottomHalf = document.createElement('div');
            bottomHalf.className = 'flap-half flap-bottom';
            const bottomContent = document.createElement('div');
            bottomContent.className = 'flap-content';
            bottomContent.textContent = startChar;
            bottomHalf.appendChild(bottomContent);
            
            flap.appendChild(topHalf);
            flap.appendChild(bottomHalf);
            container.appendChild(flap);
            
            return container;
        }

        function updateStaticFlaps(char) {
            const topContent = this.querySelector('.flap-top .flap-content');
            const bottomContent = this.querySelector('.flap-bottom .flap-content');
            if (topContent) topContent.textContent = char;
            if (bottomContent) bottomContent.textContent = char;
        }

        function getCharSequence(startChar, endChar) {
            const startCode = startChar.charCodeAt(0);
            const endCode = endChar.charCodeAt(0);
            const sequence = [];
            const distance = Math.abs(endCode - startCode);
            const skipAmount = distance > 30 ? 3 : 1;
            
            if (startCode < endCode) {
                for (let i = startCode; i <= endCode; i += skipAmount) {
                    sequence.push(String.fromCharCode(i));
                }
                if (sequence[sequence.length - 1] !== endChar) {
                    sequence.push(endChar);
                }
            } else {
                for (let i = startCode; i >= endCode; i -= skipAmount) {
                    sequence.push(String.fromCharCode(i));
                }
                if (sequence[sequence.length - 1] !== endChar) {
                    sequence.push(endChar);
                }
            }
            
            return sequence;
        }

        function animateFlap(container, startChar, finalChar) {
            const sequence = getCharSequence(startChar, finalChar);
            const baseFlipDuration = 250;
            let flipIndex = 0;
            
            function getFlipDuration(index, total) {
                const progress = index / Math.max(total - 1, 1);
                
                if (progress < 0.3) {
                    const easeProgress = progress / 0.3;
                    return baseFlipDuration * (1 - easeProgress * 0.6);
                } else if (progress > 0.7) {
                    const easeProgress = (progress - 0.7) / 0.3;
                    return baseFlipDuration * (0.4 + easeProgress * 0.6);
                } else {
                    return baseFlipDuration * 0.4;
                }
            }
            
            function flip() {
                if (flipIndex >= sequence.length) {
                    return;
                }
                
                const currentChar = sequence[flipIndex];
                const duration = getFlipDuration(flipIndex, sequence.length);
                
                const flipElement = document.createElement('div');
                flipElement.className = 'flap-flip';
                flipElement.style.animation = `flip ${duration}ms ease-in-out`;
                
                const content = document.createElement('div');
                content.className = 'flap-content';
                content.textContent = currentChar;
                
                flipElement.appendChild(content);
                container.appendChild(flipElement);
                
                updateStaticFlaps.call(container, currentChar);
                
                setTimeout(() => {
                    flipElement.remove();
                }, duration);
                
                flipIndex++;
                
                if (flipIndex < sequence.length) {
                    setTimeout(flip, duration);
                }
            }
            
            flip();
        }

        // Build split-flap display
        const flapContainers = [];
        targetText.split('').forEach((char, index) => {
            const startChar = startText[index] || 'a';
            const container = createFlap(startChar, char, index);
            flapContainers.push(container);
            splitFlapTitle.appendChild(container);
        });

        // Start animation after delay
        setTimeout(() => {
            flapContainers.forEach((container, index) => {
                const startChar = startText[index] || 'a';
                const finalChar = targetText[index];
                if (finalChar !== ' ') {
                    setTimeout(() => {
                        animateFlap(container, startChar, finalChar);
                    }, index * 50);
                }
            });
        }, 200);

        const isMobile = window.matchMedia('(max-width: 900px)').matches;

        // Dynamic scaling for split-flap + filters (match index.html ratios)
        let initialMobileScale = null;
        function updateTitleBlockScale() {
            const titleBlock = document.querySelector('.title-block');
            if (!titleBlock) return;
            const header = titleBlock.querySelector('.header');
            const filters = titleBlock.querySelector('.filters');

            // Get the natural width of the title block (unscaled)
            const tempScale = titleBlock.style.transform;
            titleBlock.style.transform = 'scale(1)';
            const headerWidth = header ? header.scrollWidth : 0;
            const filtersWidth = filters ? filters.scrollWidth : 0;
            const naturalWidth = Math.max(headerWidth, filtersWidth, titleBlock.scrollWidth);
            titleBlock.style.transform = tempScale || '';

            // Get viewport width with some padding
            const viewportWidth = window.innerWidth - 40; // 20px padding on each side

            // Calculate scale based on viewport, capped at 0.75 for full screen
            const scale = Math.min(0.75, viewportWidth / naturalWidth);
            if (isMobile) {
                if (initialMobileScale === null) {
                    initialMobileScale = scale;
                }
                titleBlock.style.transform = `scale(${initialMobileScale})`;
                return;
            }

            // Apply the scale
            titleBlock.style.transform = `scale(${scale})`;
        }

        // Update scale on load and resize
        window.addEventListener('load', updateTitleBlockScale);
        if (!isMobile) {
            window.addEventListener('resize', updateTitleBlockScale);
        }

        // Initial scale update
        setTimeout(updateTitleBlockScale, 100);

        // Project sorting functionality
        const filterButtons = document.querySelectorAll('.filter-btn');
        const projectsGrid = document.getElementById('projectsGrid');
        let projects = Array.from(document.querySelectorAll('.project'));

        // Auto-sort by date on load
        sortProjects('date');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                filterButtons.forEach(btn => btn.classList.remove('active'));
                // Add active class to clicked button
                button.classList.add('active');

                const sortType = button.dataset.sort;
                sortProjects(sortType);
            });
        });

        function sortProjects(sortType) {
            // Store initial positions
            const initialPositions = projects.map(project => {
                const rect = project.getBoundingClientRect();
                return {
                    element: project,
                    top: rect.top,
                    left: rect.left
                };
            });

            let sortedProjects;

            switch(sortType) {
                case 'date':
                    sortedProjects = projects.sort((a, b) => {
                        return new Date(b.dataset.date) - new Date(a.dataset.date);
                    });
                    break;
                case 'name':
                    sortedProjects = projects.sort((a, b) => {
                        return a.dataset.name.localeCompare(b.dataset.name);
                    });
                    break;
                case 'progress':
                    sortedProjects = projects.sort((a, b) => {
                        return a.dataset.progress.localeCompare(b.dataset.progress);
                    });
                    break;
                case 'random':
                    sortedProjects = projects.sort(() => Math.random() - 0.5);
                    break;
                default:
                    sortedProjects = projects;
            }

            // Clear and re-append in new order
            projectsGrid.innerHTML = '';
            sortedProjects.forEach(project => {
                projectsGrid.appendChild(project);
            });

            // Get final positions
            const finalPositions = sortedProjects.map(project => {
                const rect = project.getBoundingClientRect();
                return {
                    element: project,
                    top: rect.top,
                    left: rect.left
                };
            });

            // Lock hover during sort
            sortedProjects.forEach(p => p.classList.add('sorting'));
            setTimeout(() => {
                sortedProjects.forEach(p => p.classList.remove('sorting'));
            }, 700);

            // Animate from initial to final positions
            sortedProjects.forEach((project, index) => {
                const initial = initialPositions.find(p => p.element === project);
                const final = finalPositions[index];

                if (initial) {
                    const deltaX = initial.left - final.left;
                    const deltaY = initial.top - final.top;

                    // Set initial position
                    project.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    project.style.transition = 'none';

                    // Force reflow
                    project.offsetHeight;

                    // Animate to final position
                    project.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    project.style.transform = 'translate(0, 0)';
                }
            });
        }
        // 3D tilt + glare on hover
        document.querySelectorAll('.project').forEach(card => {
            card.addEventListener('mouseenter', () => {
                if (card.classList.contains('sorting')) return;
                card.style.transition = 'box-shadow 0.3s ease, border-color 0.3s ease, scale 0.3s ease';
            });

            card.addEventListener('mousemove', (e) => {
                if (card.classList.contains('sorting')) return;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = ((y - centerY) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;

                card.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
                const pctX = (x / rect.width) * 100;
                const pctY = (y / rect.height) * 100;
                card.style.setProperty('--mouse-x', `${pctX}%`);
                card.style.setProperty('--mouse-y', `${pctY}%`);
                const angle = Math.atan2(y - centerY, x - centerX) * (180 / Math.PI);
                card.style.setProperty('--border-angle', `${angle}deg`);
            });

            card.addEventListener('mouseleave', () => {
                card.style.transition = 'transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, scale 0.3s ease';
                card.style.transform = '';
            });
        });
        // Ripple background animation (ported from fw16 LED matrix ripples.py)
        (function() {
            const canvas = document.getElementById('rippleCanvas');
            const ctx = canvas.getContext('2d');
            const ripples = [];
            const MAX_RIPPLES = 20;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            class Ripple {
                constructor(cx, cy) {
                    this.cx = cx;
                    this.cy = cy;
                    this.radius = 0;
                    this.speed = 60 + Math.random() * 40;
                    this.width = 2.5 + Math.random() * 1.5;
                    this.amplitude = 0.5 + Math.random() * 0.3;
                    this.decay = 0.8 + Math.random() * 0.4;
                }

                step(dt) {
                    this.radius += this.speed * dt;
                    this.amplitude *= Math.exp(-this.decay * dt);
                }

                isDead() {
                    return this.amplitude < 0.005 || this.radius > Math.max(canvas.width, canvas.height);
                }
            }

            function spawnRipple() {
                const cx = Math.random() * canvas.width;
                const cy = Math.random() * canvas.height;
                ripples.push(new Ripple(cx, cy));
                if (ripples.length > MAX_RIPPLES) ripples.shift();
            }

            // Spawn ripples at random intervals
            function scheduleSpawn() {
                const delay = 800 + Math.random() * 2000;
                setTimeout(() => {
                    spawnRipple();
                    scheduleSpawn();
                }, delay);
            }
            // Start with a few
            for (let i = 0; i < 3; i++) spawnRipple();
            scheduleSpawn();

            let last = performance.now();
            function animate(now) {
                const dt = (now - last) / 1000;
                last = now;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = ripples.length - 1; i >= 0; i--) {
                    const r = ripples[i];
                    r.step(dt);
                    if (r.isDead()) {
                        ripples.splice(i, 1);
                        continue;
                    }

                    const alpha = r.amplitude;
                    ctx.beginPath();
                    ctx.arc(r.cx, r.cy, r.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(224, 168, 0, ${alpha})`;
                    ctx.lineWidth = r.width;
                    ctx.stroke();

                    // Faint inner ring
                    if (r.radius > 10) {
                        ctx.beginPath();
                        ctx.arc(r.cx, r.cy, r.radius * 0.6, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(224, 168, 0, ${alpha * 0.3})`;
                        ctx.lineWidth = r.width * 0.5;
                        ctx.stroke();
                    }
                }

                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
