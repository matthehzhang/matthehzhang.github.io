<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew H Zhang</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
    <style>
        :root { --background: #fff; --foreground: #0a0a0a; --muted: #737373; --accent: #00f; }
        [data-theme="dark"] { --background: #0a0a0a; --foreground: #fff; --muted: #a3a3a3; --accent: #f60; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--background); color: var(--foreground); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px 24px; text-align: center; transition: background 0.3s, color 0.3s; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 16px; }
        p { font-size: 17px; line-height: 1.6; color: var(--muted); margin-bottom: 12px; max-width: 340px; }
        .links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        a { color: var(--accent); text-decoration: none; font-size: 16px; }
        a:hover { opacity: 0.8; }
    </style>
    <script>
        window.addEventListener('resize', function() { if (window.innerWidth > 768) window.location.replace('index.html'); });
    </script>
</head>
<body>
    <h1>Matthew H Zhang</h1>
    <p>view on desktop to see the portfolio</p>
    <div class="links">
        <a href="https://linkedin.com/in/matthew-h-zhang" target="_blank">LinkedIn</a>
        <a href="https://github.com/matthehzhang" target="_blank">GitHub</a>
        <a href="https://twitter.com/matthehzhang" target="_blank">Twitter</a>
        <a href="matthewzhangresume.pdf" target="_blank">Resume</a>
    </div>
</body>
</html>
