    <style>
        :root {
            --white: #fff; --black: #0a0a0a; --blue: #00f; --orange: #f60;
            --grey-200: #e5e5e5; --grey-400: #a3a3a3; --grey-500: #737373;
            --grey-800: #262626; --grey-900: #171717;
            --accent: var(--blue); --background: var(--white); --foreground: var(--black);
            --muted: var(--grey-500); --border: var(--grey-200);
            --surface: var(--grey-200); --overlay-bg: #0009;
            --tiniest: 4px; --tinier: 8px; --tiny: 12px; --smallest: 16px;
            --smaller: 24px; --small: 32px; --big: 48px;
            --margin: var(--smallest); --radius: 6px; --radius-large: 8px; --radius-small: 4px;
            overscroll-behavior-y: none; font-family: Inter, sans-serif;
        }
        @media (min-width: 769px) { :root { --margin: var(--small); } }
        [data-theme="dark"] {
            --accent: var(--orange); --background: var(--black); --foreground: var(--white);
            --muted: var(--grey-400); --border: var(--grey-800);
            --surface: var(--grey-900); --overlay-bg: #000c;
        }

        ::selection { background-color: var(--accent); color: var(--white); }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        *, a, button { cursor: none !important; }
        .cursor-dot { position: fixed; pointer-events: none; z-index: 2147483647; transform: translate(-50%, -50%); transition: font-size 0.2s ease, transform 0.3s ease; font-size: 18px; font-weight: 300; color: #fff; mix-blend-mode: difference; line-height: 1; }
        .cursor-ring { position: fixed; width: 28px; height: 28px; border: 2px solid #fff; mix-blend-mode: difference; border-radius: 50%; pointer-events: none; z-index: 2147483646; transform: translate(-50%, -50%); transition: width 0.2s ease, height 0.2s ease, opacity 0.2s ease; opacity: 0.5; }
        .cursor-ring.hovering { width: 56px; height: 56px; opacity: 0.9; }
        @keyframes cursorSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        .cursor-dot.hovering { font-size: 26px; font-weight: 300; animation: cursorSpin 2s linear infinite; }
        @media (max-width: 768px) { .cursor-dot, .cursor-ring { display: none; } *, a, button { cursor: auto !important; } }

        body { background: var(--background); color: var(--foreground); font-feature-settings: "liga" 1, "calt" 1, "ss04" 1, "ss07" 1; font-optical-sizing: auto; font-family: Inter, sans-serif; font-weight: 400; line-height: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        a { color: inherit; text-decoration: inherit; }
        button, input, select, textarea { font: inherit; color: inherit; background: transparent; }

        header { padding: var(--margin); pointer-events: none; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .header-inner { pointer-events: auto; justify-content: space-between; align-items: center; display: flex; }
        .logo { font-size: var(--smallest); color: #fff; letter-spacing: -0.01em; font-weight: 500; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
        nav { align-items: center; gap: var(--smaller); display: flex; }
        .nav-sep { color: rgba(255,255,255,0.3); font-weight: 300; font-size: 14px; }
        .nav-link { font-size: var(--smallest); color: rgba(255,255,255,0.55); font-weight: 400; text-decoration: none; transition: color 0.2s; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
        .nav-link:hover { color: #fff; }
        .nav-link.active { color: #fff; }
        .back-button { width: 32px; height: 32px; margin-right: var(--tinier); color: rgba(255,255,255,0.55); display: flex; justify-content: center; align-items: center; transition: color 0.2s; }
        .back-button:hover { color: #fff; }
        .theme-toggle { width: 32px; height: 32px; margin-left: var(--tinier); color: rgba(255,255,255,0.55); cursor: pointer; background: none; border: none; justify-content: center; align-items: center; padding: 0; transition: color 0.2s; display: flex; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
        .theme-toggle:hover { color: #fff; }
        .icon-sun { display: block; }
        .icon-moon { display: none; }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: block; }
        @media (max-width: 768px) {
            header { z-index: 1000; }
            nav { gap: var(--smallest); }
            .theme-toggle { width: 24px; height: 24px; }
        }

        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #canvas-container canvas { display: block; }


        .sound-toggle { position: fixed; bottom: calc(var(--margin) + 36px); left: var(--margin); z-index: 50; width: 32px; height: 32px; border: none; background: none; color: #fff; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; pointer-events: auto; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4)); opacity: 0.8; }
        .sound-toggle:hover { opacity: 1; }
        .sound-toggle .sound-on { display: none; } .sound-toggle.active .sound-on { display: inline; }
        .sound-toggle .sound-off { display: inline; } .sound-toggle.active .sound-off { display: none; }

        .hint { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 50; font-size: 15px; color: rgba(255,255,255,0.45); opacity: 1; transition: opacity 1s ease; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
        .hint.hidden { opacity: 0; }

        .modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--overlay-bg); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-large); padding: var(--smaller); max-width: 380px; width: 90%; position: relative; display: flex; flex-direction: column; gap: var(--smallest); transform: translateY(10px); transition: transform 0.25s ease; }
        .modal.active .modal-content { transform: translateY(0); }

        /* Create panel — floats bottom-right with margins */
        #createModal { background: none; display: block; }
        #createModal .modal-content { position: fixed; bottom: 48px; right: 48px; top: 80px; width: 33vw; min-width: 320px; max-width: 480px; border-radius: var(--radius-large); border: 1px solid var(--border); transform: translateY(20px); opacity: 0; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
        #createModal.active .modal-content { transform: translateY(0); opacity: 1; }
        @media (max-width: 768px) { #createModal .modal-content { width: auto; min-width: unset; left: 24px; right: 24px; } }
        .modal-content h3 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
        .close-modal { position: absolute; top: 12px; right: 14px; background: none; border: none; font-size: 20px; color: var(--muted); transition: color 0.2s; line-height: 1; padding: 4px; }
        .close-modal:hover { color: var(--foreground); }

        .msg-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-small); font-size: 15px; resize: none; line-height: 1.5; background: var(--surface); color: var(--foreground); transition: border-color 0.2s; flex: 1; min-height: 80px; }
        .msg-input:focus { outline: none; border-color: var(--accent); }
        .msg-input::placeholder { color: var(--muted); }
        .draw-section { display: flex; flex-direction: column; gap: var(--tinier); flex: 2; }
        .draw-section label { font-size: 13px; color: var(--muted); }
        #drawCanvas { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-small); background: var(--surface); touch-action: none; flex: 1; min-height: 120px; image-rendering: pixelated; image-rendering: crisp-edges; }
        .draw-tools { display: flex; align-items: center; gap: var(--tinier); }
        .pen-color { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; transition: border-color 0.2s, transform 0.15s; flex-shrink: 0; }
        .pen-color:hover { transform: scale(1.15); }
        .pen-color.active { border-color: var(--foreground); }
        .clear-draw { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-small); padding: 3px 10px; margin-left: auto; transition: color 0.2s, border-color 0.2s; }
        .clear-draw:hover { color: var(--foreground); border-color: var(--foreground); }
        .color-picker-section { display: flex; flex-direction: column; gap: var(--tinier); }
        .color-picker-section label { font-size: 13px; color: var(--muted); }
        #colorPicker { width: 100%; height: 60px; border-radius: var(--radius-small); border: 1px solid var(--border); touch-action: none; }
        .color-preview { display: flex; align-items: center; gap: var(--tinier); margin-top: 2px; }
        .color-preview-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); }
        .color-preview-label { font-size: 12px; color: var(--muted); }
        .input-wrap { position: relative; }
        .char-count { position: absolute; bottom: 6px; right: 8px; font-size: 11px; color: var(--accent); pointer-events: none; }
        .sig-input { width: 100%; padding: 10px 12px; padding-right: 45px; border: 1px solid var(--border); border-radius: var(--radius-small); font-size: 14px; background: var(--surface); color: var(--foreground); }
        .sig-input:focus { outline: none; border-color: var(--accent); }
        .sig-input::placeholder { color: var(--muted); }
        .submit-btn { background: var(--foreground); color: var(--background); border: none; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; transition: opacity 0.2s; align-self: flex-end; margin-top: auto; }
        .submit-btn:hover { opacity: 0.85; }
        .view-msg { font-size: 15px; line-height: 1.5; word-break: break-word; }
        .view-drawing { width: 100%; border-radius: var(--radius-small); border: 1px solid var(--border); }
        .view-date { font-size: 12px; color: var(--muted); }

        .credits { position: fixed; bottom: var(--margin); left: var(--margin); z-index: 50; font-size: 13px; color: rgba(255,255,255,0.75); pointer-events: auto; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .credits a { color: rgba(255,255,255,0.85); text-decoration: underline; text-underline-offset: 2px; transition: color 0.2s; }
        .credits a:hover { color: #fff; }

        .wasd-hint { position: fixed; bottom: 130px; left: var(--margin); z-index: 50; pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; opacity: 0.85; }
        .wasd-movement-row { display: flex; align-items: center; gap: 12px; }
        .wasd-movement-row > .controls-label { align-self: flex-end; margin-bottom: 4px; }
        .wasd-keys { display: flex; flex-direction: column; gap: 5px; }
        .wasd-row { display: flex; gap: 5px; }
        .wasd-key { width: 42px; height: 42px; border: 1.5px solid rgba(255,255,255,0.6); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.08); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .wasd-key.active { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.9); color: #fff; }
        .wasd-spacer { width: 0px; }
        .controls-label { font-size: 15px; color: rgba(255,255,255,0.7); margin-top: 6px; letter-spacing: 0.02em; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .enter-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .enter-key { padding: 8px 18px; border: 1.5px solid rgba(255,255,255,0.6); border-radius: 7px; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.08); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .enter-key.active { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.9); color: #fff; }
        .controls-used .enter-key { background: rgba(0, 0, 255, 0.12); border-color: rgba(0, 0, 255, 0.3); }
        .controls-used .enter-label { color: rgba(255,255,255,0.5); }
        .controls-used .enter-label::after { content: ' (used)'; }
        [data-theme="dark"] .controls-used .enter-key { background: rgba(255, 102, 0, 0.12); border-color: rgba(255, 102, 0, 0.3); }
        .wasd-row { display: flex; gap: 4px; }
        .wasd-key { width: 36px; height: 36px; border: 1.5px solid rgba(255,255,255,0.6); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.08); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .wasd-key.active { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.9); color: #fff; }

        .horizon-blur { position: fixed; left: 0; right: 0; top: 3%; height: 15%; z-index: 1; pointer-events: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); mask: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent); -webkit-mask: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent); }

        .boat-label { position: fixed; z-index: 40; pointer-events: none; transform: translate(-50%, -100%); opacity: 0; transition: opacity 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 200px; }
        .boat-label.visible { opacity: 1; }
        .boat-label-bubble { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 10px; padding: 8px 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 6px; }
        .boat-label-msg { font-size: 12px; color: #1a1a1a; line-height: 1.4; word-break: break-word; }
        .boat-label-img { width: 100%; border-radius: 6px; }
        .boat-label-arrow { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid rgba(255,255,255,0.92); }
        [data-theme="dark"] .boat-label-bubble { background: rgba(20,25,35,0.92); }
        [data-theme="dark"] .boat-label-msg { color: #e0e0e0; }
        [data-theme="dark"] .boat-label-arrow { border-top-color: rgba(20,25,35,0.92); }

        .player-marker { position: fixed; z-index: 39; pointer-events: none; transform: translate(-50%, -100%); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .player-marker svg { display: block; }

<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ==================== FIREBASE ====================
firebase.initializeApp({
    apiKey: "AIzaSyAQz6Tg5SP0XcsyBVPMhr6UExb7Vjp9BX4",
    authDomain: "matthehzhang-github.firebaseapp.com",
    projectId: "matthehzhang-github",
    storageBucket: "matthehzhang-github.firebasestorage.app",
    messagingSenderId: "972590029378",
    appId: "1:972590029378:web:fb3fb39ac4d77538d52bdb",
});
const db = firebase.firestore();

// ==================== CONFIG ====================
const BOAT_AREA = 40, STORAGE_KEY = 'paperboats_data', PUSH_RADIUS = 1.8, PUSH_FORCE = 4.0;
const SEEDS = [];
function isDark(){return document.documentElement.hasAttribute('data-theme');}

// ==================== RENDERER ====================
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.5, 2000);

// ==================== LIGHTING ====================
const dirLight = new THREE.DirectionalLight(0xfff8e8, 1.5);
dirLight.position.set(5,20,5);
scene.add(dirLight);
const ambLight = new THREE.AmbientLight(0x88ccff, 0.8);
scene.add(ambLight);

// ==================== WATER ====================
const water = new Water(new THREE.PlaneGeometry(10000,10000), {
    textureWidth:512, textureHeight:512,
    waterNormals: new THREE.TextureLoader().load('waternormals.jpg', t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;}),
    sunDirection: new THREE.Vector3(0.3,1,0.2), sunColor:0xffffee,
    waterColor:0x0044aa, distortionScale:3.0, alpha:1.0,
});
water.rotation.x = -Math.PI/2;
water.material.uniforms['size'].value = 4.0;

// Blue background for water reflections (camera won't see this — sky dome covers it)
scene.background = new THREE.Color(0x3388cc);
scene.add(water);

// White sky dome
const skyGeo = new THREE.SphereGeometry(900, 32, 16, 0, Math.PI*2, 0, Math.PI/2);
const skyMat = new THREE.MeshBasicMaterial({color:0xf0f4f8, side:THREE.BackSide, fog:false});
const skyDome = new THREE.Mesh(skyGeo, skyMat);
skyDome.layers.set(1);
scene.add(skyDome);
camera.layers.enable(1);

// Boundary ring — visible edge of the play area
const BOUNDARY = 100;
const boundaryGeo = new THREE.RingGeometry(BOUNDARY - 1, BOUNDARY + 1, 64);
const boundaryMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.15,
    side: THREE.DoubleSide, depthWrite: false,
});
const boundaryRing = new THREE.Mesh(boundaryGeo, boundaryMat);
boundaryRing.rotation.x = -Math.PI / 2;
boundaryRing.position.y = 0.05;
scene.add(boundaryRing);

let waterTime = 0;

function getWaterHeight(x,z,phase){
    return Math.sin(waterTime*0.7+(phase||0))*0.04 + Math.cos(waterTime*0.5+(phase||0)*1.3)*0.03;
}
function getSlope(x,z,h,phase){
    const p = Math.cos(waterTime*0.7+(phase||0))*0.06;
    const r = Math.sin(waterTime*0.5+(phase||0)*1.3)*0.04;
    return{pitch:p, roll:r};
}

function updateTheme(){
    const d=isDark();
    water.material.uniforms['waterColor'].value.set(d?0x001833:0x0044aa);
    scene.background.set(d?0x081020:0x3388cc);
    skyMat.color.set(d?0x080c12:0xf0f4f8);
    scene.fog=new THREE.FogExp2(d?0x0c1828:0xd8e8f0,0.001);
    dirLight.intensity=d?0.5:1.5; ambLight.intensity=d?0.3:0.8;
    renderer.toneMappingExposure=d?0.5:1.0;
}

// ==================== PLAYER (boat physics) ====================
const player = {x:0, z:0, heading:0, speed:0, drift:0, tilt:0};
let playerBoat = null;
const keys = {};
const keyEls = {w:document.getElementById('keyW'),a:document.getElementById('keyA'),s:document.getElementById('keyS'),d:document.getElementById('keyD'),enter:document.getElementById('keyEnter')};
window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    // Don't capture keys when typing in the create panel
    if(leavingMode && (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')) return;
    keys[k]=true;
    if(keyEls[k])keyEls[k].classList.add('active');
    if(k==='enter') keyEls.enter.classList.add('active');
    // Enter opens create panel
    if(e.key==='Enter' && !localStorage.getItem(HAS_LEFT_KEY) && !cModal.classList.contains('active')){
        leavingMode=true; cModal.classList.add('active'); setTimeout(()=>msgIn.focus(),400);
    }
});
window.addEventListener('keyup', e=>{
    const k=e.key.toLowerCase();
    if(leavingMode && (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')) { keys[k]=false; return; }
    keys[k]=false;
    if(keyEls[k])keyEls[k].classList.remove('active');
    if(k==='enter') keyEls.enter.classList.remove('active');
});

function updatePlayer(dt){
    const throttle = keys.w||keys.arrowup;
    const brake = keys.s||keys.arrowdown;
    const left = keys.a||keys.arrowleft;
    const right = keys.d||keys.arrowright;

    // Acceleration / drag
    if(throttle) player.speed = Math.min(player.speed + 3.5*dt, 6);
    else if(brake) player.speed = Math.max(player.speed - 5*dt, -1.5);
    else player.speed *= (1 - 1.2*dt); // water drag
    if(Math.abs(player.speed)<0.02) player.speed=0;

    // Turn rate scales with speed (can't turn standing still)
    const speedFactor = Math.min(Math.abs(player.speed)/3, 1);
    const turnRate = 1.8 * speedFactor;
    const turnInput = (left?1:0) - (right?1:0);
    player.heading += turnInput * turnRate * dt;

    // Drift — turning at speed creates sideways slide
    const targetDrift = turnInput * player.speed * 0.15;
    player.drift += (targetDrift - player.drift) * 3 * dt;
    player.drift *= (1 - 2*dt); // drift friction

    // Tilt into turns
    const targetTilt = -turnInput * speedFactor * 0.15;
    player.tilt += (targetTilt - player.tilt) * 4 * dt;

    // Move forward + sideways drift
    const fwdX = Math.sin(player.heading), fwdZ = Math.cos(player.heading);
    const sideX = Math.cos(player.heading), sideZ = -Math.sin(player.heading);
    player.x += (fwdX * player.speed + sideX * player.drift) * dt;
    player.z += (fwdZ * player.speed + sideZ * player.drift) * dt;

    // Boundary — strong push back toward center
    const dist = Math.sqrt(player.x * player.x + player.z * player.z);
    if (dist > BOUNDARY) {
        const over = dist - BOUNDARY;
        const push = over * 2.0;
        player.x -= (player.x / dist) * push * dt;
        player.z -= (player.z / dist) * push * dt;
        // Kill forward speed but don't slow reverse — let them escape
        if (player.speed > 0) player.speed *= 0.9;
    }

    if(playerBoat){
        const wy=getWaterHeight(player.x,player.z,0);
        const sl=getSlope(player.x,player.z,player.heading,0);
        playerBoat.position.set(player.x, wy - 0.02, player.z);
        const accelPitch = player.speed > 0.5 && throttle ? -0.05 : player.speed > 0.5 ? 0.02 : 0;
        playerBoat.rotation.set(-sl.pitch + accelPitch, player.heading, -sl.roll + player.tilt);
    }
}

// ==================== SMART CAMERA ====================
const camPos=new THREE.Vector3(0,6,-10), camLook=new THREE.Vector3(0,0.5,3);
let camSide = 0.35; // which side of the boat (positive = right, negative = left)
let smoothAngle = 0.35;
let prevHeading = 0;

function updateCam(){
    const speedRatio = Math.min(Math.abs(player.speed) / 4, 1);

    // Track turning — only swap sides on sustained intentional turns
    let headingDelta = player.heading - prevHeading;
    while (headingDelta > Math.PI) headingDelta -= Math.PI * 2;
    while (headingDelta < -Math.PI) headingDelta += Math.PI * 2;
    prevHeading = player.heading;

    // Only react if actually moving
    if (speedRatio > 0.15) {
        // Gently drift toward outside of turn
        const targetSide = camSide - headingDelta * 3;
        camSide += (targetSide - camSide) * 0.02;
    }

    camSide = Math.max(-0.7, Math.min(0.7, camSide));
    if (speedRatio > 0.1) {
        camSide += (0.3 - camSide) * 0.001;
    }
    // When stopped, don't move at all — hold current angle

    // Boat awareness — subtle nudge only when moving
    let boatBias = 0;
    if (speedRatio > 0.1) {
        let totalWeight = 0;
        for (const m of boats) {
            const dx = m.userData.bx - player.x, dz = m.userData.bz - player.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist > 2 && dist < 30) {
                let delta = Math.atan2(dx, dz) - player.heading;
                while (delta > Math.PI) delta -= Math.PI * 2;
                while (delta < -Math.PI) delta += Math.PI * 2;
                const w = (1 - dist / 30);
                boatBias += delta * w;
                totalWeight += w;
            }
        }
        if (totalWeight > 0) boatBias = (boatBias / totalWeight) * 0.08;
    }

    const targetAngle = camSide + boatBias;
    smoothAngle += (targetAngle - smoothAngle) * 0.01;

    let angle, camDist, camH, lx, lz, lerpPos, lerpLook;

    if (leavingMode) {
        // Zoom in, swing right so boat sits in left third of screen
        angle = player.heading + 1.2;
        camDist = 4;
        camH = 2.2;
        lx = player.x + Math.sin(player.heading) * 0.5;
        lz = player.z + Math.cos(player.heading) * 0.5;
        lerpPos = 0.04;
        lerpLook = 0.06;
    } else {
        angle = player.heading + smoothAngle;
        camDist = 9 + speedRatio * 2;
        camH = 4.5 + speedRatio * 1;
        const ahead = speedRatio * 4;
        lx = player.x + Math.sin(player.heading) * ahead;
        lz = player.z + Math.cos(player.heading) * ahead;
        lerpPos = 0.05;
        lerpLook = 0.06;
    }

    const bx = player.x - Math.sin(angle) * camDist;
    const bz = player.z - Math.cos(angle) * camDist;
    camPos.lerp(new THREE.Vector3(bx, camH, bz), lerpPos);
    camLook.lerp(new THREE.Vector3(lx, 0.2, lz), lerpLook);

    camera.position.copy(camPos); camera.lookAt(camLook);

    // Player marker pin
    if (playerBoat) {
        const mp = playerBoat.position.clone();
        mp.y += 1.2;
        mp.project(camera);
        const pm = document.getElementById('playerMarker');
        if (mp.z < 1) {
            pm.style.left = (mp.x * 0.5 + 0.5) * innerWidth + 'px';
            pm.style.top = (-mp.y * 0.5 + 0.5) * innerHeight + 'px';
            pm.style.display = '';
        } else pm.style.display = 'none';
    }

    // Move horizon blur to match where the horizon actually is on screen
    const horizonPoint = new THREE.Vector3(player.x, 0, player.z + 500);
    horizonPoint.project(camera);
    const horizonY = (-horizonPoint.y * 0.5 + 0.5) * 100; // percent from top
    const blurEl = document.querySelector('.horizon-blur');
    if (blurEl) blurEl.style.top = (horizonY - 7) + '%';
}

// ==================== MODELS ====================
let boatTemplate = null;
function makeFallback(){
    const v=[],t=(a,b,c)=>v.push(...a,...b,...c);
    const B=[0,.1,-.9],S=[0,.1,.9],PF=[-.28,.2,-.42],PM=[-.44,.22,0],PB=[-.28,.2,.42];
    const SF=[.28,.2,-.42],SM=[.44,.22,0],SB=[.28,.2,.42];
    const KF=[0,.02,-.42],KM=[0,-.05,0],KB=[0,.02,.42];
    const RF=[0,.48,-.32],R=[0,.58,0],RB=[0,.48,.32];
    t(B,PF,KF);t(PF,KM,KF);t(PF,PM,KM);t(PM,KB,KM);t(PM,PB,KB);t(PB,S,KB);
    t(B,KF,SF);t(SF,KF,KM);t(SF,KM,SM);t(SM,KM,KB);t(SM,KB,SB);t(SB,KB,S);
    t(B,PF,RF);t(PF,R,RF);t(PF,PM,R);t(PM,RB,R);t(PM,PB,RB);t(PB,S,RB);
    t(B,RF,SF);t(SF,RF,R);t(SF,R,SM);t(SM,R,RB);t(SM,RB,SB);t(SB,RB,S);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));
    g.computeVertexNormals(); return g;
}
const fallbackGeo = makeFallback();

// Player boat shader — screen-space diagonal lines
const playerShaderMat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    transparent: true,
    uniforms: { time: { value: 0 } },
    vertexShader: `
        varying vec4 vScreenPos;
        varying vec3 vNormal;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            vScreenPos = gl_Position;
        }
    `,
    fragmentShader: `
        uniform float time;
        varying vec4 vScreenPos;
        varying vec3 vNormal;
        void main() {
            // Basic lighting for geometry visibility
            float light = dot(vNormal, normalize(vec3(0.3, 1.0, 0.2))) * 0.3 + 0.7;
            vec3 base = vec3(0.92) * light;
            // Screen-space diagonal lines
            vec2 screen = vScreenPos.xy / vScreenPos.w;
            float stripe = sin((screen.x + screen.y) * 250.0 - time * 3.0) * 0.5 + 0.5;
            float line = smoothstep(0.45, 0.5, stripe);
            vec3 col = mix(base, vec3(0.5) * light, line * 0.5);
            gl_FragColor = vec4(col, 0.85);
        }
    `,
});

function makePlayerBoat(useStripes) {
    const mat = useStripes ? playerShaderMat : new THREE.MeshStandardMaterial({color:'#ffffff',roughness:0.8,flatShading:true,side:THREE.DoubleSide});
    const w = new THREE.Group();
    if (boatTemplate) {
        const m = boatTemplate.clone();
        m.traverse(c => { if (c.isMesh) c.material = mat; });
        w.add(m);
    } else {
        w.add(new THREE.Mesh(fallbackGeo, mat));
        w.children[0].scale.set(0.55, 0.55, 0.55);
    }
    w.scale.set(1.15, 1.15, 1.15);
    return w;
}

function applyStripesToPlayer() {
    if (!playerBoat) return;
    playerBoat.traverse(c => { if (c.isMesh) c.material = playerShaderMat; });
}

function makeBoat(color){
    const mat=new THREE.MeshStandardMaterial({color,roughness:0.8,flatShading:true,side:THREE.DoubleSide});
    const w=new THREE.Group();
    if(boatTemplate){
        const m=boatTemplate.clone();
        m.traverse(c=>{if(c.isMesh) c.material=mat.clone();});
        w.add(m);
    } else {
        w.add(new THREE.Mesh(fallbackGeo,mat));
        w.children[0].scale.set(0.55,0.55,0.55);
    }
    return w;
}

const boats=[], boatGroup=new THREE.Group();
scene.add(boatGroup);

// localStorage fallback
function loadBoatsLocal(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}}
function saveBoatsLocal(boats){localStorage.setItem(STORAGE_KEY,JSON.stringify(boats));}

async function loadBoatsFromDB(){
    // Try Firestore first, fall back to localStorage
    try {
        const snap = await Promise.race([
            db.collection('boats').limit(200).get(),
            new Promise((_,rej) => setTimeout(()=>rej('read timeout'), 3000))
        ]);
        const out = []; snap.forEach(d=>out.push({id:d.id,...d.data()})); return out;
    } catch(e){
        console.warn('Firestore read failed, using localStorage:', e);
        return loadBoatsLocal();
    }
}
async function isDBLocked(){
    try{const d=await db.collection('config').doc('lock').get();return d.exists&&d.data().locked===true;}catch{return false;}
}
async function saveBoatToDB(data){
    if(await isDBLocked()){alert('Boat submissions are currently closed.');return;}
    const local = loadBoatsLocal(); local.push(data); saveBoatsLocal(local);
    try {
        await Promise.race([
            db.collection('boats').add(data),
            new Promise((_,rej) => setTimeout(()=>rej('write timeout'), 3000))
        ]);
    } catch(e){ console.warn('Firestore write:', e); }
}

function addBoat(data,seed){
    const m=makeBoat(data.color||'#f5f0e8');
    m.userData={id:data.id||Math.random().toString(36).slice(2), message:data.message,
        signature:data.signature||null, drawing:data.drawing||null, timestamp:data.timestamp||null, isSeed:!!seed,
        bx:data.x??(Math.random()-.5)*BOAT_AREA, bz:data.z??(Math.random()-.5)*BOAT_AREA,
        phase:Math.random()*Math.PI*2, dx:(Math.random()-.5)*0.08, dz:(Math.random()-.5)*0.08,
        yaw:Math.random()*Math.PI*2};
    boatGroup.add(m); boats.push(m);
}

async function initBoats(){
    SEEDS.forEach(b=>addBoat(b,true));
    const userBoats = await loadBoatsFromDB();
    userBoats.forEach(b=>addBoat(b,false));
   }

function animateBoats(){
    const dt=0.016, lim=BOAT_AREA/2;
    const pushR = PUSH_RADIUS;
    const pushF = PUSH_FORCE;
    for(const m of boats){
        const d=m.userData;
        const ex=d.bx-player.x, ez=d.bz-player.z, dist=Math.sqrt(ex*ex+ez*ez);
        if(dist<pushR&&dist>0.01){
            const f=(pushR-dist)/pushR*pushF*dt;
            d.bx+=ex/dist*f; d.bz+=ez/dist*f;
            d.dx+=ex/dist*f*0.3; d.dz+=ez/dist*f*0.3;
        }
        d.bx+=d.dx*dt; d.bz+=d.dz*dt; d.dx*=0.998; d.dz*=0.998;
        if(Math.abs(d.bx)>lim)d.dx*=-1; if(Math.abs(d.bz)>lim)d.dz*=-1;
        const wy=getWaterHeight(d.bx,d.bz,d.phase), sl=getSlope(d.bx,d.bz,d.yaw,d.phase);
        m.position.set(d.bx, wy-0.02, d.bz);
        m.rotation.set(-sl.pitch, d.yaw, -sl.roll);
    }
}

// ==================== PROXIMITY LABELS ====================
const LABEL_DIST = 6;
const labelContainer = document.getElementById('boatLabels');
const labelCache = new Map(); // boatId -> DOM element

function getOrCreateLabel(d) {
    if (labelCache.has(d.id)) return labelCache.get(d.id);
    const el = document.createElement('div');
    el.className = 'boat-label';
    let html = '<div class="boat-label-bubble">';
    if (d.drawing) html += `<img class="boat-label-img" src="${d.drawing}">`;
    html += `<span class="boat-label-msg">${d.message.replace(/</g,'&lt;')}</span>`;
    if (d.signature) html += `<span class="boat-label-msg" style="color:#888;margin-top:2px">— ${d.signature.replace(/</g,'&lt;')}</span>`;
    html += '</div><div class="boat-label-arrow"></div>';
    el.innerHTML = html;
    labelContainer.appendChild(el);
    labelCache.set(d.id, el);
    return el;
}

function updateLabels() {
    for (const m of boats) {
        const d = m.userData;
        const dx = d.bx - player.x, dz = d.bz - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < LABEL_DIST) {
            const el = getOrCreateLabel(d);
            // Project boat position to screen
            const pos = m.position.clone();
            pos.y += 0.8; // above the boat
            pos.project(camera);
            if (pos.z > 1) { el.classList.remove('visible'); continue; } // behind camera
            const sx = (pos.x * 0.5 + 0.5) * window.innerWidth;
            const sy = (-pos.y * 0.5 + 0.5) * window.innerHeight;
            el.style.left = sx + 'px';
            el.style.top = sy + 'px';
            el.classList.add('visible');
        } else if (labelCache.has(d.id)) {
            labelCache.get(d.id).classList.remove('visible');
        }
    }
}

// Color picker canvas — hue on X, saturation+lightness on Y
const cpCvs = document.getElementById('colorPicker');
const cpCtx = cpCvs.getContext('2d');
const cpSwatch = document.getElementById('colorSwatch');
const cpLabel = document.getElementById('colorLabel');

function drawColorPicker() {
    const w = cpCvs.width, h = cpCvs.height;
    for (let x = 0; x < w; x++) {
        const hue = (x / w) * 360;
        for (let y = 0; y < h; y++) {
            const sat = 50 + (1 - y / h) * 50; // 50-100%
            const lit = 40 + (y / h) * 45; // 40-85% (bright pastels at top, rich colors at bottom)
            cpCtx.fillStyle = `hsl(${hue},${sat}%,${lit}%)`;
            cpCtx.fillRect(x, y, 1, 1);
        }
    }
}

function initColorPicker() {
    const r = cpCvs.getBoundingClientRect();
    cpCvs.width = r.width * 2;
    cpCvs.height = r.height * 2;
    cpCtx.scale(1, 1);
    drawColorPicker();
    cpSwatch.style.background = selColor;
}

function pickColor(e) {
    const r = cpCvs.getBoundingClientRect();
    const x = Math.max(0, Math.min(cpCvs.width - 1, ((e.clientX - r.left) / r.width) * cpCvs.width));
    const y = Math.max(0, Math.min(cpCvs.height - 1, ((e.clientY - r.top) / r.height) * cpCvs.height));
    const px = cpCtx.getImageData(x, y, 1, 1).data;
    selColor = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    cpSwatch.style.background = selColor;
    cpLabel.textContent = selColor;
    updatePlayerBoatColor(selColor);
}

let cpDrag = false;
cpCvs.addEventListener('pointerdown', e => { cpDrag = true; pickColor(e); });

// Drawing
const dCvs=document.getElementById('drawCanvas'), dCtx=dCvs.getContext('2d');
let pen=false, penCol='#222', isEraser=false, drawn=false;
const penSizeEl=document.getElementById('penSize');
function initDraw(){
    // Low-res canvas — Nintendo DS style pixel drawing
    dCvs.width=160; dCvs.height=120;
    dCtx.imageSmoothingEnabled=false;
    clrDraw();
}
function clrDraw(){dCtx.clearRect(0,0,dCvs.width,dCvs.height);drawn=false;}
function canvasXY(e){const r=dCvs.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*160,y:(e.clientY-r.top)/r.height*120};}
dCvs.addEventListener('pointerdown',e=>{pen=true;drawn=true;const p=canvasXY(e);dCtx.beginPath();dCtx.moveTo(p.x,p.y);
    if(isEraser){dCtx.globalCompositeOperation='destination-out';dCtx.strokeStyle='rgba(0,0,0,1)';}
    else{dCtx.globalCompositeOperation='source-over';dCtx.strokeStyle=penCol;}
    dCtx.lineWidth=parseFloat(penSizeEl.value);dCtx.lineCap='round';});
dCvs.addEventListener('pointermove',e=>{if(!pen)return;const p=canvasXY(e);dCtx.lineTo(p.x,p.y);dCtx.stroke();dCtx.beginPath();dCtx.moveTo(p.x,p.y);});
dCvs.addEventListener('pointerup',()=>pen=false);

// Profanity filter — word list loaded from CDN, never in your code
let badWords = new Set();
fetch('https://cdn.jsdelivr.net/npm/naughty-words@1.2.0/en.json')
    .then(r=>r.json()).then(list=>{ badWords = new Set(list.map(w=>w.toLowerCase())); })
    .catch(()=>{});

function hasProfanity(text) {
    const words = text.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/);
    return words.some(w => badWords.has(w));
}

// Char counters
const msgCount=document.getElementById('msgCharCount'), sigCount=document.getElementById('sigCharCount');
msgIn.addEventListener('input',()=>{msgCount.textContent=140-msgIn.value.length;});

let submitting = false;
document.getElementById('submitBoat').addEventListener('click', async ()=>{
    if(submitting || localStorage.getItem(HAS_LEFT_KEY)) return;
    submitting = true;
    const msg=msgIn.value.trim();
    const sigEl=document.getElementById('sigInput');
    const sig=sigEl.value.trim();
    if(!msg){msgIn.style.borderColor='#e55';setTimeout(()=>msgIn.style.borderColor='',1000);submitting=false;return;}
    if(!sig){sigEl.style.borderColor='#e55';setTimeout(()=>sigEl.style.borderColor='',1000);submitting=false;return;}
    if(hasProfanity(msg)||hasProfanity(sig)){
        msgIn.style.borderColor='#e55';sigEl.style.borderColor='#e55';
        setTimeout(()=>{msgIn.style.borderColor='';sigEl.style.borderColor='';},1500);
        submitting=false;return;
    }
    // Lock immediately before async write to prevent double-submit
    localStorage.setItem(HAS_LEFT_KEY, '1');
    const d={message:msg, signature:sig||null, drawing:drawn?dCvs.toDataURL('image/png'):null,
        color:selColor, timestamp:Date.now(), x:player.x, z:player.z};

    addBoat(d,false);    msgIn.value=''; document.getElementById('sigInput').value=''; clrDraw(); closeCreate();
    checkIfAlreadyLeft();
    applyStripesToPlayer();
});

// ==================== BOOT ====================
const loader = new GLTFLoader();

function loadModel(url) {
    return new Promise(resolve => {
        loader.load(url, gltf => {
            const m = gltf.scene;
            const box = new THREE.Box3().setFromObject(m);
            const s = 1 / Math.max(...box.getSize(new THREE.Vector3()).toArray());
            m.scale.set(s, s, s);
            const c = box.getCenter(new THREE.Vector3());
            m.position.set(-c.x*s, -box.min.y*s, -c.z*s);
            resolve(m);
        }, undefined, () => resolve(null));
    });
}

(async function boot() {
    boatTemplate = await loadModel('paper-boat.glb');

    const alreadyLeft = !!localStorage.getItem(HAS_LEFT_KEY);
    playerBoat = makePlayerBoat(alreadyLeft);
    scene.add(playerBoat);

    try {
        await Promise.race([initBoats(), new Promise((_,rej) => setTimeout(()=>rej('timeout'), 2000))]);
    } catch(e) {
        console.warn('Boat load:', e);
        if (!boats.length) SEEDS.forEach(b => addBoat(b, true));
    }
})();
